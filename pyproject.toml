[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-bridge"
version = "0.2.0"
description = "Web chat → job queue → local `claude -p` worker bridge: SSE streaming, tool events, cancel, usage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.5,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
serve = ["uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "anyio>=4", "ruff>=0.6"]

[project.scripts]
claude-bridge = "claude_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"claude_bridge" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
