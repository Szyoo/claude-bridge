[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-bridge"
version = "0.6.0"
description = "Web chat → job queue → local `claude -p` worker bridge: SSE streaming, tool events, cancel, usage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.5,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
# szyyw-auth: portal SSO for `serve --multi-user` (SZYYW_SSO=1). Only the server needs it — the worker and the
# hosts that embed the routers don't. Tarball spec, not git+: the python:slim image has no git.
serve = [
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "szyyw-auth @ https://github.com/Szyoo/szyyw-auth/archive/refs/tags/v0.2.0.tar.gz#subdirectory=python",
]
dev = ["pytest>=8", "httpx>=0.27", "anyio>=4", "ruff>=0.6"]

[project.scripts]
claude-bridge = "claude_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# vendor/szyyw-design: @szyyw/design for the SSO corner tools (scripts/update-design.sh); "static/*" does not recurse;
# static/site: favicon files of the standalone site, from szyyw-platform/branding
"claude_bridge" = ["static/*", "static/vendor/szyyw-design/*", "static/site/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
