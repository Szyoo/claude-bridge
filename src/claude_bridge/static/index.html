<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claude-bridge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="{{design_origin}}" crossorigin />
  <link rel="stylesheet" href="{{design_base}}/tokens.css" />
  <link rel="stylesheet" href="{{design_base}}/components.css" />
  <script type="importmap">{"imports": {"@szyyw/design/": "{{design_base}}/"}}</script>
  <link rel="stylesheet" href="/static/bridge/bridge-widget.css" />
  <link rel="stylesheet" href="/static/bridge/bridge-pages.css" />
  <script type="module" src="/static/bridge/corner-boot.js"></script>
  <style>
    #app { height: 100vh; height: 100dvh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js" defer></script>
</head>
<body class="bp-chat">
  <div id="app"></div>
  <script type="module">
    import { BridgeClient } from '/static/bridge/bridge-client.js';
    import { mountBridgeWidget } from '/static/bridge/bridge-widget.js';
    const client = new BridgeClient({ baseUrl: '/api', onAuthLost: () => { location.href = '/login'; } });
    mountBridgeWidget(document.getElementById('app'), client, {
      scope: '', title: 'claude-bridge', fill: true,
      sideFoot: '<form method="post" action="/logout" class="bp-me"><span class="grow"></span><button type="submit" class="bridge-btn bridge-btn-ghost bridge-tiny">退出</button></form>',
    });
  </script>
</body>
</html>
