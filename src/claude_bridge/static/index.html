<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>claude-bridge</title>
  <link rel="stylesheet" href="/static/bridge/bridge-widget.css" />
  <style>
    body { margin: 0; }
    #app { height: 100vh; }
    .bridge-topbar { position: fixed; right: 12px; top: 8px; z-index: 2; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js" defer></script>
</head>
<body class="bridge-root">
  <form class="bridge-topbar" method="post" action="/logout"><button type="submit" class="bridge-btn bridge-btn-ghost bridge-tiny">退出</button></form>
  <div id="app"></div>
  <script type="module">
    import { BridgeClient } from '/static/bridge/bridge-client.js';
    import { mountBridgeWidget } from '/static/bridge/bridge-widget.js';
    const client = new BridgeClient({ baseUrl: '/api', onAuthLost: () => { location.href = '/login'; } });
    mountBridgeWidget(document.getElementById('app'), client, { scope: '', title: 'claude-bridge' });
  </script>
</body>
</html>
