<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claude-bridge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="{{design_origin}}" crossorigin />
  <link rel="stylesheet" href="{{design_base}}/tokens.css" />
  <link rel="stylesheet" href="{{design_base}}/components.css" />
  <script type="importmap">{"imports": {"@szyyw/design/": "{{design_base}}/"}}</script>
  <link rel="stylesheet" href="/static/bridge/bridge-widget.css" />
  <link rel="stylesheet" href="/static/bridge/bridge-pages.css" />
  <script type="module" src="/static/bridge/corner-boot.js"></script>
  <style>
    #app { height: 100vh; height: 100dvh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js" defer></script>
</head>
<body class="bp-chat">
  <div class="bg-layer"></div>
  <div id="app"></div>
  <script type="module">
    import { BridgeClient } from '/static/bridge/bridge-client.js';
    import { mountBridgeWidget, loadPrefs, savePrefs, applyPrefs } from '/static/bridge/bridge-widget.js';
    import { api, esc, fmtPct, fmtSeen, toast, confirmTyped } from '/static/bridge/bridge-pages.js';
    import { enhanceSwitches } from '@szyyw/design/switch.js';

    const client = new BridgeClient({ baseUrl: '/api', onAuthLost: () => { location.href = '/login'; } });
    const app = document.getElementById('app');
    const store = {
      get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
      set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
    };

    // Chat = scope ""; Code = scope "code:<project>", one directory per project in the user's own space
    let mode = store.get('bridge_mode', '') === 'code' ? 'code' : '';
    let project = store.get('bridge_project', '') || null;
    let widget = null, projects = [], agentOnline = true, poll = null, openWhenReady = null;

    // Chat ⟨switch⟩ Code (@szyyw/design Squish Switch); both words are clickable too
    const toggle = () => `<span class="bp-mode" role="group" aria-label="模式">`
      + `<button type="button" class="l${mode === '' ? ' on' : ''}" data-mode="" aria-pressed="${mode === ''}">Chat</button>`
      + `<input type="checkbox" class="switch" data-mode-switch data-width="34" data-height="18" aria-label="Code 模式"${mode === 'code' ? ' checked' : ''} />`
      + `<button type="button" class="l${mode === 'code' ? ' on' : ''}" data-mode="code" aria-pressed="${mode === 'code'}">Code</button></span>`;
    // who is signed in + your own use of the 5h / weekly windows: top right in every view (the sidebar foot on phones)
    const ME = '<span class="bp-me bp-me-top"></span>';
    let unSwitch = null;
    const wireSwitch = () => { unSwitch?.(); unSwitch = enhanceSwitches(app); };

    // Swaps views with a View Transition: the sidebar box and the top bar stay, their contents slide in the
    // direction of travel (Chat → Code → a project is "forward"). No animation for reduced motion / old browsers.
    const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
    async function transition(update, dir = '') {
      if (!document.startViewTransition || reduced()) return update();
      const html = document.documentElement;
      html.dataset.vt = dir;
      const t = document.startViewTransition(update);
      try { await t.finished; } catch {} finally { delete html.dataset.vt; }
    }
    // let the new sidebar list arrive before the "after" snapshot, so it slides in instead of popping in later
    const listReady = (ms = 450) => new Promise((resolve) => {
      const list = app.querySelector('.bridge-threads');
      if (!list || list.childElementCount) return resolve();
      const mo = new MutationObserver(() => { if (list.childElementCount) { mo.disconnect(); resolve(); } });
      mo.observe(list, { childList: true });
      setTimeout(() => { mo.disconnect(); resolve(); }, ms);
    });

    async function setMode(next) {
      if (next === mode) return;
      const sw = app.querySelector('[data-mode-switch]');
      if (sw && sw.checked !== (next === 'code')) sw.checked = next === 'code';
      for (const b of app.querySelectorAll('.bp-mode [data-mode]')) { const on = b.dataset.mode === next; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }
      mode = next; store.set('bridge_mode', mode);
      if (!reduced()) await new Promise(r => setTimeout(r, 300));  // let the switch slide first
      if (mode === next) transition(() => show(), next === 'code' ? 'fwd' : 'back');
    }

    function unmount() { widget?.destroy(); widget = null; clearTimeout(poll); poll = null; }

    function mountChat(scope, extra = '', proj = null) {
      unmount();
      // Code: the sidebar is this project's sessions, headed by the project itself
      const code = proj ? {
        sideHead: `<div class="bp-side-proj"><span class="ic">${FOLDER}</span><div class="who"><div class="n">${esc(proj.name)}</div>`
          + `<div class="d">${esc([proj.info?.branch, proj.source ? proj.source.replace(/^https?:\/\//, '').replace(/\.git$/, '') : '本地项目'].filter(Boolean).join(' · '))}</div></div>`
          + `<button type="button" class="bridge-btn bridge-btn-ghost bridge-tiny" data-home title="切换 / 新建项目">切换</button></div>`,
        strings: { newThread: '＋ 新会话', threadTitle: '新会话', del: '删除会话', delConfirm: '删除这个会话？记录会一起删除，项目里的文件不受影响。',
          empty: `在 ${proj.name} 里开始：描述你想让 Claude 做的事` },
      } : {};
      widget = mountBridgeWidget(app, client, {
        scope, title: 'claude-bridge', fill: true, topStart: toggle() + extra, topEnd: ME, sideFoot: '<div class="bp-me bp-me-side"></div>',
        placeholder: scope ? '让 Claude 读代码、改文件、跑命令' : '输入消息', ...code,
      });
      wireSwitch();
      renderMe();
      return listReady();
    }

    async function show() {
      if (mode === '') { document.title = 'claude-bridge · Chat'; return mountChat(''); }
      if (project) {
        await loadProjects();
        const p = projects.find(x => x.name === project && x.status === 'ready');
        if (p) {
          document.title = `claude-bridge · ${p.name}`;
          return mountChat(`code:${p.name}`, `<button type="button" class="bp-proj" data-home title="切换 / 新建项目">${FOLDER}<span>${esc(p.name)}</span><i>▾</i></button>`, p);
        }
        project = null; store.set('bridge_project', null);
      }
      return showHome();
    }

    const FOLDER = '<svg viewBox="0 0 16 16" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 4.2c0-.6.5-1.1 1.1-1.1h3.2l1.4 1.5h5.6c.6 0 1.1.5 1.1 1.1v6.2c0 .6-.5 1.1-1.1 1.1H2.9c-.6 0-1.1-.5-1.1-1.1z"/></svg>';
    const STATUS = { creating: ['准备中…', 'amber'], deleting: ['删除中…', 'red'], failed: ['失败', 'red'] };

    async function loadProjects() {
      try { const d = await api('GET', '/api/projects'); projects = d.items; agentOnline = !!d.agent?.online; } catch (e) { toast(e.message, true); }
    }

    // ---------- the project picker (Code mode without an open project) ----------
    async function showHome() {
      unmount();
      document.title = 'claude-bridge · Code';
      await loadProjects();
      if (openWhenReady && projects.some(p => p.name === openWhenReady && p.status === 'ready')) {
        project = openWhenReady; openWhenReady = null; store.set('bridge_project', project); return show();
      }
      const busy = projects.some(p => p.status === 'creating' || p.status === 'deleting');
      const rows = projects.map(p => {
        const [st, cls] = STATUS[p.status] || ['', ''];
        const src = p.source ? esc(p.source.replace(/^https?:\/\//, '')) : '空项目';
        const meta = [p.info?.branch ? `分支 ${esc(p.info.branch)}` : '', p.threads ? `${p.threads} 段对话` : '', p.last_used ? esc(fmtSeen(p.last_used)) : ''].filter(Boolean).join(' · ');
        return `<div class="inner bp-project${p.status === 'ready' ? ' ready' : ''}" ${p.status === 'ready' ? `data-open="${esc(p.name)}" tabindex="0" role="button"` : ''}>
          <span class="ic">${FOLDER}</span>
          <div class="who"><div class="n">${esc(p.name)} ${st ? `<span class="pill ${cls}">${st}</span>` : ''}</div>
            <div class="d">${src}${meta ? ` · ${meta}` : ''}</div>
            ${p.status === 'failed' && p.error ? `<div class="d err-text">${esc(p.error)}</div>` : ''}</div>
          ${p.status === 'deleting' ? '' : `<button type="button" class="btn-ghost btn-small danger" data-del="${esc(p.name)}" title="删除项目">删除</button>`}
        </div>`;
      }).join('');
      // same frame as the chat: sidebar (the projects, like the thread list) + top bar + the picker in the main area
      const side = projects.map(p => {
        const [st] = STATUS[p.status] || ['', ''];
        const ready = p.status === 'ready';
        const meta = [st, p.info?.branch, p.threads ? `${p.threads} 段对话` : '', p.last_used ? fmtSeen(p.last_used) : ''].filter(Boolean).join(' · ');
        return `<button type="button" class="bridge-thread"${ready ? ` data-open="${esc(p.name)}"` : ' disabled'}>`
          + `<span class="t">${esc(p.name)}</span><span class="p">${esc(p.source ? p.source.replace(/^https?:\/\//, '') : '空项目')}</span>`
          + `<span class="m">${esc(meta)}</span></button>`;
      }).join('');
      app.innerHTML = `<div class="bridge fill bp-homeview">
        <aside class="bridge-side"><button type="button" class="bridge-btn bridge-new" data-act="home-new">＋ 新建项目</button>
          <div class="bridge-threads">${side}</div><div class="bridge-side-foot"><div class="bp-me bp-me-side"></div></div></aside>
        <div class="bridge-side-scrim" data-act="side-close"></div>
        <div class="bridge-main">
          <div class="bridge-top"><button type="button" class="bridge-icon" data-act="side" title="项目列表">☰</button>${toggle()}<span class="bridge-title">选择项目</span>${ME}</div>
          <div class="bp-home"><main class="bp-wrap narrow">
          <p class="page-sub">每个项目是你专属空间里的一个目录（通常是 git 仓库）。Claude 在项目里读写文件、跑命令，每个项目有自己的对话记录。</p>
          ${agentOnline ? '' : '<div class="callout warn">helper 现在离线：新建 / 克隆会排队，等它上线后执行。</div>'}
          <div class="bp-projects">${rows || '<p class="muted small">还没有项目，先克隆一个仓库或新建一个空项目。</p>'}</div>
          <div class="bp-grid">
            <form class="glass panel" data-form="clone">
              <h2 class="panel-title bp-lead">克隆 Git 仓库</h2>
              <div class="form-row"><label for="pj-url">仓库地址（https:// 或 git@）</label><input id="pj-url" class="field" name="url" required placeholder="https://github.com/用户/仓库.git" autocapitalize="none" spellcheck="false" /></div>
              <div class="form-row"><label for="pj-cname">项目名（可留空，默认用仓库名）</label><input id="pj-cname" class="field" name="name" maxlength="64" autocapitalize="none" spellcheck="false" /></div>
              <div class="actions"><button class="btn">克隆</button></div>
            </form>
            <form class="glass panel" data-form="new">
              <h2 class="panel-title bp-lead">新建空项目</h2>
              <div class="form-row"><label for="pj-name">项目名（字母、数字、. _ -）</label><input id="pj-name" class="field" name="name" required maxlength="64" placeholder="my-app" autocapitalize="none" spellcheck="false" />
                <p class="hint">会建一个带 git 的空目录，之后让 Claude 从零开始写。</p></div>
              <div class="actions"><button class="btn">创建</button></div>
            </form>
          </div>
        </main></div></div></div>`;
      applyPrefs(app.firstElementChild, loadPrefs());  // the chat's sidebar on / off and width
      wireSwitch();
      renderMe();
      if (busy || openWhenReady) poll = setTimeout(showHomeIfStill, 2000);
    }
    const showHomeIfStill = () => { if (mode === 'code' && !project) showHome(); };

    app.addEventListener('click', async (e) => {
      const m = e.target.closest('.bp-mode [data-mode]');
      if (m) return setMode(m.dataset.mode);
      if (e.target.closest('[data-home]')) { project = null; store.set('bridge_project', null); return transition(() => show(), 'back'); }
      // the project picker's own sidebar (the chat widget handles these itself)
      const act = e.target.closest('.bp-homeview [data-act]')?.dataset.act;
      if (act === 'side') {
        const root = app.firstElementChild;
        if (matchMedia('(max-width: 720px)').matches) root.classList.toggle('side-open');
        else { const pr = loadPrefs(); pr.sidebar = !pr.sidebar; savePrefs(pr); applyPrefs(root, pr); }
        return;
      }
      if (act === 'side-close') return app.firstElementChild.classList.remove('side-open');
      if (act === 'home-new') { app.firstElementChild.classList.remove('side-open'); return app.querySelector('#pj-url')?.focus(); }
      const del = e.target.closest('[data-del]');
      if (del) {
        const name = del.dataset.del;
        if (!await confirmTyped({ title: `删除项目「${name}」`, message: '目录里的文件和这个项目的对话都会删掉。', expect: name, okLabel: '删除项目' })) return;
        try { await api('DELETE', `/api/projects/${encodeURIComponent(name)}`); } catch (err) { toast(err.message, true); }
        return showHome();
      }
      const open = e.target.closest('[data-open]');
      if (open) { project = open.dataset.open; store.set('bridge_project', project); return transition(() => show(), 'fwd'); }
    });
    app.addEventListener('change', (e) => { if (e.target.matches('[data-mode-switch]')) setMode(e.target.checked ? 'code' : ''); });
    app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches?.('[data-open]')) e.target.click(); });
    app.addEventListener('submit', async (e) => {
      const f = e.target.closest('[data-form]');
      if (!f) return;
      e.preventDefault();
      const body = f.dataset.form === 'clone' ? { clone_url: f.url.value.trim(), name: f.name.value.trim() } : { name: f.name.value.trim() };
      f.querySelector('button').disabled = true;
      try {
        const r = await api('POST', '/api/projects', body);
        openWhenReady = r.project.name;
        toast(f.dataset.form === 'clone' ? '开始克隆，完成后自动打开' : '正在创建…');
      } catch (err) { toast(err.message, true); f.querySelector('button').disabled = false; return; }
      showHome();
    });

    // who is signed in + how much of their share is left
    async function renderMe() {
      const boxes = app.querySelectorAll('.bp-me');
      if (!boxes.length) return;
      let d;
      try { d = await api('GET', '/api/me'); } catch { return; }
      const u = d.user, us = d.usage;
      // your own use of each window (of your share, when the admin set one)
      const parts = [['five_hour', '5h'], ['seven_day', '周']]
        .filter(([k]) => us[k].used_pct != null)
        .map(([k, l]) => `${l} ${fmtPct(us[k].used_pct)}${us[k].limit_pct != null ? `/${fmtPct(us[k].limit_pct)}` : ''}`);
      const sub = us.blocked ? '额度已用完' : (parts.join(' · ') || (u.role === 'admin' ? '管理员' : '账户设置'));
      const html = `<a class="me" href="/account" title="账户设置与用量${us.blocked ? `\n${esc(us.blocked)}` : ''}">`
        + `<span class="n">${esc((d.sso && d.sso.portal_user) || u.display_name || u.username)}</span><span class="u${us.blocked ? ' full' : ''}">${esc(sub)}</span></a>`
        + (u.role === 'admin' ? '<a class="bridge-btn bridge-btn-ghost bridge-tiny" href="/admin">管理</a>' : '')
        // portal SSO: sign-out lives in the corner account menu (it signs out of the portal); no local button
        + (d.sso ? '' : '<form method="post" action="/logout"><button type="submit" class="bridge-btn bridge-btn-ghost bridge-tiny" title="退出登录">退出</button></form>');
      for (const b of boxes) b.innerHTML = html;
    }
    show();
    setInterval(renderMe, 120000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) renderMe(); });
  </script>
</body>
</html>
