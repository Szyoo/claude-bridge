<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>claude-bridge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="claude-bridge" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f8" />
  <link rel="preconnect" href="{{design_origin}}" crossorigin />
  <link rel="stylesheet" href="{{design_base}}/tokens.css" />
  <link rel="stylesheet" href="{{design_base}}/components.css" />
  <script type="importmap">{"imports": {"@szyyw/design/": "{{design_base}}/"}}</script>
  <link rel="stylesheet" href="/static/bridge/bridge-widget.css" />
  <link rel="stylesheet" href="/static/bridge/bridge-pages.css" />
  <script type="module" src="/static/bridge/corner-boot.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js" defer></script>
</head>
<body class="bp-chat app-screen">
  <div class="bg-layer"></div>
  <div id="app" class="app-fill"></div>
  <script type="module">
    import { BridgeClient } from '/static/bridge/bridge-client.js';
    import { mountBridgeWidget, loadPrefs, savePrefs, applyPrefs } from '/static/bridge/bridge-widget.js';
    import { api, esc, fmtPct, fmtSeen, toast, fmtMoney, fmtBalance, fmtTok } from '/static/bridge/bridge-pages.js';
    import { attachMenu } from '@szyyw/design/menu.js';
    import { confirm } from '@szyyw/design/confirm.js';
    import { iconSvg } from '@szyyw/design/icons.js';
    import { fitViewport, autoUpdate, defaultIsBusy } from '@szyyw/design/webapp.js';
    fitViewport();  // one screen that follows the visible viewport: the composer sits on the phone keyboard
    import { openLightbox } from '@szyyw/design/lightbox.js';

    const client = new BridgeClient({ baseUrl: '/api', onAuthLost: () => { location.href = '/login'; } });
    const app = document.getElementById('app');
    const store = {
      get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
      set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
    };

    // Chat = scope ""; Code = scope "code:<project>", one directory per project in the user's own space
    let mode = store.get('bridge_mode', '') === 'code' ? 'code' : '';
    let project = store.get('bridge_project', '') || null;
    let widget = null, projects = [], agentOnline = true, poll = null, openWhenReady = null, localProjects = false;
    const bq = () => backend ? `?backend=${encodeURIComponent(backend)}` : '';
    // Claude ⟨switch⟩ another backend (e.g. DeepSeek, admins the worker allows): its threads live in scopes
    // "<scope>@<name>", so each side has its own thread list, model menu and settings. Shown only when offered.
    let backends = [], backend = store.get('bridge_backend', '') || '';
    const sfx = () => backend ? `@${backend}` : '';
    const backendLabel = () => backends.find(b => b.name === backend)?.label || backend;
    // ---- the sidebar: the model service on top (the biggest switch: Claude | DeepSeek), ＋ new, then a tree —
    // 对话 and each project are nodes that open to their sessions (titles only) — and your account at the foot. The
    // top bar only names the open conversation. On the DeepSeek side everything about the account is DeepSeek's own.
    const backendSeg = () => {
      if (!backends.length) return '';
      // the tab shows the short name ("Qwen（本地）" → "Qwen"); the full one is its tooltip
      const opt = (name, label) => `<button type="button" data-backend="${esc(name)}" aria-pressed="${backend === name}"${backend === name ? ' class="active"' : ''} title="${esc(label)}">${esc(String(label).replace(/\s*[（(].*[）)]\s*$/, '') || label)}</button>`;
      return `<div class="seg bp-backend" role="group" aria-label="模型服务">${opt('', 'Claude')}${backends.map(b => opt(b.name, b.label)).join('')}</div>`;
    };
    // The tree. A node's key: "chat" (the plain conversations) or "p:<project>". The open node's session list is the
    // chat widget's own (moved into its [data-threads-slot]); other opened nodes list their sessions' titles, fetched
    // when opened. Which nodes are open is remembered per service.
    const treeKey = () => `bridge_tree_${backend || 'claude'}`;
    const loadOpen = () => { try { return new Set(JSON.parse(store.get(treeKey(), '[]'))); } catch { return new Set(); } };
    let openNodes = loadOpen();
    const saveOpen = () => store.set(treeKey(), JSON.stringify([...openNodes]));
    const scopeOf = (key) => key === 'chat' ? sfx() : `code:${key.slice(2)}${sfx()}`;
    const activeKey = () => mode === '' ? 'chat' : (project ? `p:${project}` : null);
    const CHEVRON = iconSvg('chevron-right'), PLUS = iconSvg('plus');
    function treeNode(key, icon, name, sub, active) {
      const isActive = key === active, open = isActive || openNodes.has(key);
      return `<div class="bp-node${key === 'chat' ? ' chat' : ''}${isActive ? ' active' : ''}${open ? ' open' : ''}" data-node="${esc(key)}">`
        + `<div class="bp-node-head"><button type="button" class="bp-node-toggle" data-toggle aria-expanded="${open}">${CHEVRON}${icon}`
        + `<span class="n">${esc(name)}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ''}</button>`
        + `<button type="button" class="bp-node-new" data-new title="新会话" aria-label="在 ${esc(name)} 里开新会话">${PLUS}</button></div>`
        + `<div class="bp-node-body">${isActive ? '<div data-threads-slot></div>' : ''}</div></div>`;
    }
    function treeHtml(active) {
      const ready = projects.filter(p => p.status === 'ready');
      const busyRows = projects.filter(p => p.status === 'creating' || p.status === 'failed');
      // projects with sessions (and the open / opened ones) up front; on a service whose projects are a whole folder
      // of repositories, the rest wait under 「其他」 (the search finds them too)
      const front = ready.filter(p => p.threads || `p:${p.name}` === active || openNodes.has(`p:${p.name}`) || !localProjects);
      const rest = ready.filter(p => !front.includes(p));
      const projNode = (p) => treeNode(`p:${p.name}`, FOLDER, p.name, p.info?.branch || '', active);
      return '<input type="search" class="field small bp-tree-search" placeholder="搜索会话和项目" aria-label="搜索会话和项目" autocomplete="off" data-1p-ignore data-lpignore="true" />'
        + '<div class="bp-tree">'
        + treeNode('chat', iconSvg('sparkles'), '对话', '', active)
        + `<div class="bp-tree-label"><span>项目</span><button type="button" class="bp-tree-add" data-home title="新建、克隆或管理项目" aria-label="新建、克隆或管理项目">${PLUS}</button></div>`
        + front.map(projNode).join('')
        + busyRows.map(p => `<div class="bp-node pending"><div class="bp-node-head"><span class="bp-node-toggle">${FOLDER}<span class="n">${esc(p.name)}</span>`
          + `<span class="pill ${STATUS[p.status]?.[1] || ''}">${STATUS[p.status]?.[0] || ''}</span></span></div></div>`).join('')
        + (rest.length ? `<details class="bp-tree-more"><summary>其他 ${rest.length} 个${localProjects ? '文件夹' : '项目'}</summary>${rest.map(projNode).join('')}</details>` : '')
        + (ready.length ? '' : '<p class="bp-tree-empty">还没有项目：点上面的 ＋ 新建或克隆</p>')
        + '</div>';
    }
    // opened nodes other than the active one: their sessions' titles
    async function fillNode(node) {
      const body = node.querySelector(':scope > .bp-node-body');
      if (!body || node.classList.contains('active') || body.dataset.loaded) return;
      body.dataset.loaded = '1';
      body.innerHTML = '<div class="bp-tree-note">加载中…</div>';
      try {
        const d = await api('GET', `/api/threads?scope=${encodeURIComponent(scopeOf(node.dataset.node))}`);
        body.innerHTML = d.items.length
          ? d.items.map(t => `<button type="button" class="bp-tree-thread" data-thread="${esc(t.id)}">${t.pinned ? '<span class="pin">📌</span>' : ''}${esc(t.title || (node.dataset.node === 'chat' ? '新对话' : '新会话'))}</button>`).join('')
          : '<div class="bp-tree-note">还没有会话</div>';
      } catch (e) { body.innerHTML = ''; delete body.dataset.loaded; toast(e.message, true); }
    }
    const fillOpenNodes = () => { for (const n of app.querySelectorAll('.bp-node.open:not(.active)')) fillNode(n); };
    // go to a node (and a conversation in it, or a new one there)
    async function goNode(key, threadId = null, fresh = false) {
      const same = key === activeKey();
      if (same && widget) {
        if (threadId) return widget.openThread(threadId);
        if (fresh) return app.querySelector('.bridge [data-act="new"]')?.click();
        return;
      }
      const was = activeKey();  // the node being left stays open, like the one being entered
      if (was) openNodes.add(was);
      openNodes.add(key); saveOpen();
      if (threadId) { try { await client.selectThread(threadId, scopeOf(key)); } catch {} }
      mode = key === 'chat' ? '' : 'code'; project = key === 'chat' ? null : key.slice(2);
      store.set('bridge_mode', mode); store.set('bridge_project', project);
      await transition(() => show(), key === 'chat' ? 'back' : 'fwd');
      if (fresh) app.querySelector('.bridge [data-act="new"]')?.click();
    }
    const ACCT = '<div class="bp-acct"></div>';
    // another provider (DeepSeek): its account balance and spend, a small card linking to its own page; filled by renderAccount
    const svcCard = () => backend ? `<a class="bp-svc-card" href="/account?svc=${encodeURIComponent(backend)}" aria-label="${esc(backendLabel())} 余额与用量"></a>` : '';
    const sideHead = () => (backendSeg() + svcCard()) || undefined;

    // Swaps views with a View Transition: the sidebar box and the top bar stay, their contents slide in the
    // direction of travel (Chat → Code → a project is "forward"). No animation for reduced motion / old browsers.
    const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
    async function transition(update, dir = '') {
      if (!document.startViewTransition || reduced()) return update();
      const html = document.documentElement;
      html.dataset.vt = dir;
      const t = document.startViewTransition(update);
      // the update runs only once a frame renders; a page that renders none (a background pane) would wait forever
      const guard = setTimeout(() => t.skipTransition(), 1500);
      try { await t.finished; } catch {} finally { clearTimeout(guard); delete html.dataset.vt; }
    }
    // let the new sidebar list arrive before the "after" snapshot, so it slides in instead of popping in later
    const listReady = (ms = 450) => new Promise((resolve) => {
      const list = app.querySelector('.bridge-threads');
      if (!list || list.childElementCount) return resolve();
      const mo = new MutationObserver(() => { if (list.childElementCount) { mo.disconnect(); resolve(); } });
      mo.observe(list, { childList: true });
      setTimeout(() => { mo.disconnect(); resolve(); }, ms);
    });


    async function setBackend(next) {
      if (next === backend) return;
      for (const b of app.querySelectorAll('.bp-backend [data-backend]')) { const on = b.dataset.backend === next; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); }
      backend = next; store.set('bridge_backend', backend || null); openNodes = loadOpen();
      if (!reduced()) await new Promise(r => setTimeout(r, 300));
      if (backend === next) transition(() => show(), next ? 'fwd' : 'back');
    }
    function unmount() { widget?.destroy(); widget = null; clearTimeout(poll); poll = null; }

    function mountChat(scope, proj = null) {
      unmount();
      const who = backend ? backendLabel() : 'Claude';
      widget = mountBridgeWidget(app, client, {
        scope, title: 'claude-bridge', fill: true, sideHead: sideHead(),
        sideNav: treeHtml(proj ? `p:${proj.name}` : 'chat'), sideFoot: ACCT,
        placeholder: proj ? `让 ${who} 读代码、改文件、跑命令` : (backend ? `给 ${who} 发消息` : '输入消息'),
        assistantName: who,
        emptyThinking: backend ? 'hide' : undefined,  // another provider's empty thinking blocks are just "didn't think"
        ...(proj ? { strings: { newThread: '＋ 新会话', threadTitle: '新会话', del: '删除会话', delConfirm: '删除这个会话？记录会一起删除，项目里的文件不受影响。',
          empty: `在 ${proj.name} 里开始：描述你想让 ${who} 做的事` } } : (backend ? { strings: { empty: `${who} · 问点什么吧` } } : {})),
        openImage: (items, start, link) => openLightbox({ items, start, returnFocus: link }),
      });
      renderAccount(); fillOpenNodes();
      return listReady();
    }

    async function show() {
      const tag = backend ? ` · ${backendLabel()}` : '';
      await loadProjects();  // the sidebar tree lists the projects in every view
      if (mode === '') { document.title = `claude-bridge · Chat${tag}`; return mountChat(sfx()); }
      if (project) {
        const p = projects.find(x => x.name === project && x.status === 'ready');
        if (p) {
          document.title = `claude-bridge · ${p.name}${tag}`;
          return mountChat(`code:${p.name}${sfx()}`, p);
        }
        project = null; store.set('bridge_project', null);
      }
      return showHome();
    }

    const FOLDER = iconSvg('folder');
    const STATUS = { creating: ['准备中…', 'warn'], deleting: ['删除中…', 'err'], failed: ['失败', 'err'] };

    async function loadProjects() {
      try {
        const d = await api('GET', `/api/projects${bq()}`);
        projects = d.items; agentOnline = !!d.agent?.online; localProjects = !!d.local;
      } catch (e) { toast(e.message, true); }
    }

    // ---------- the project picker (Code mode without an open project) ----------
    async function showHome() {
      unmount();
      document.title = 'claude-bridge · Code';
      await loadProjects();
      if (openWhenReady && projects.some(p => p.name === openWhenReady && p.status === 'ready')) {
        project = openWhenReady; openWhenReady = null; store.set('bridge_project', project); return show();
      }
      const busy = projects.some(p => p.status === 'creating' || p.status === 'deleting');
      const rows = projects.map(p => {
        const [st, cls] = STATUS[p.status] || ['', ''];
        const src = p.source ? esc(p.source.replace(/^https?:\/\//, '')) : (p.local ? (p.info?.git === false ? '文件夹（不是 git 仓库）' : '本机仓库') : '空项目');
        const meta = [p.info?.branch ? `分支 ${esc(p.info.branch)}` : '', p.threads ? `${p.threads} 段对话` : '', p.last_used ? esc(fmtSeen(p.last_used)) : ''].filter(Boolean).join(' · ');
        return `<div class="list-row"${p.status === 'ready' ? ` data-open="${esc(p.name)}" tabindex="0" role="button"` : ''}>
          <span class="row-lead">${FOLDER}</span>
          <span class="row-main"><span class="row-title">${esc(p.name)} ${st ? `<span class="pill ${cls}">${st}</span>` : ''}</span>
            <span class="row-sub">${src}${meta ? ` · ${meta}` : ''}</span>
            ${p.status === 'failed' && p.error ? `<span class="row-sub err-text">${esc(p.error)}</span>` : ''}</span>
          ${p.status === 'deleting' || p.local ? '' : `<span class="row-end"><button type="button" class="btn-ghost btn-small danger" data-del="${esc(p.name)}" title="删除项目">删除</button></span>`}
        </div>`;
      }).join('');
      // same frame as the chat: the sidebar tree + top bar + the picker in the main area
      app.innerHTML = `<div class="bridge fill bp-homeview tree">
        <aside class="bridge-side">${backends.length ? `<div class="bridge-side-head">${sideHead()}</div>` : ''}<button type="button" class="bridge-btn bridge-new" data-act="home-new">＋ 新建项目</button>
          <div class="bridge-side-nav">${treeHtml(null)}</div><div class="bridge-side-foot">${ACCT}</div></aside>
        <div class="bridge-side-scrim" data-act="side-close"></div>
        <div class="bridge-main">
          <div class="bridge-top"><button type="button" class="bridge-icon" data-act="side" title="项目列表">${iconSvg('menu')}</button><span class="bridge-title">项目</span></div>
          <div class="bp-home"><main class="bp-wrap narrow">
          <p class="page-sub">${localProjects
            ? `项目就是你电脑上${esc(projectRoot())}里的文件夹，${esc(backendLabel())} 直接在里面读写文件、跑命令，和在本机用客户端一样；新建和克隆也放到那里。网页上不删除这些文件夹。`
            : `每个项目是你专属空间里的一个目录（通常是 git 仓库）。${backend ? esc(backendLabel()) : 'Claude'} 在项目里读写文件、跑命令，每个项目有自己的对话记录。`}</p>
          ${localProjects && projects.length > 8 ? '<input type="search" class="field bp-proj-filter" placeholder="筛选项目" aria-label="筛选项目" autocomplete="off" />' : ''}
          ${agentOnline ? '' : '<div class="callout warn">helper 现在离线：新建 / 克隆会排队，等它上线后执行。</div>'}
          <div class="list gap bp-projects">${rows || '<p class="muted small">还没有项目，先克隆一个仓库或新建一个空项目。</p>'}</div>
          <div class="bp-grid">
            <form class="glass panel" data-form="clone">
              <h2 class="panel-title bp-lead">克隆 Git 仓库</h2>
              <div class="form-row"><label for="pj-url">仓库地址（https:// 或 git@）</label><input id="pj-url" class="field" name="url" required placeholder="https://github.com/用户/仓库.git" autocapitalize="none" spellcheck="false" /></div>
              <div class="form-row"><label for="pj-cname">项目名（可留空，默认用仓库名）</label><input id="pj-cname" class="field" name="name" maxlength="64" autocapitalize="none" spellcheck="false" /></div>
              <div class="actions"><button class="btn">克隆</button></div>
            </form>
            <form class="glass panel" data-form="new">
              <h2 class="panel-title bp-lead">新建空项目</h2>
              <div class="form-row"><label for="pj-name">项目名（字母、数字、. _ -）</label><input id="pj-name" class="field" name="name" required maxlength="64" placeholder="my-app" autocapitalize="none" spellcheck="false" />
                <p class="hint">会${localProjects ? `在${esc(projectRoot())}里` : ''}建一个带 git 的空目录，之后让 ${backend ? esc(backendLabel()) : 'Claude'} 从零开始写。</p></div>
              <div class="actions"><button class="btn">创建</button></div>
            </form>
          </div>
        </main></div></div></div>`;
      applyPrefs(app.firstElementChild, loadPrefs());  // the chat's sidebar on / off and width
      renderAccount(); fillOpenNodes();
      if (busy || openWhenReady) poll = setTimeout(showHomeIfStill, 2000);
    }
    const showHomeIfStill = () => { if (mode === 'code' && !project) showHome(); };
    // the folder that holds the local projects, from any listed project's path ("~/Documents/GitHub")
    function projectRoot() {
      const path = projects.find(p => p.info?.path)?.info.path || '';
      const dir = path.replace(/\/[^/]+$/, '');
      return dir ? ` ${dir.replace(/^\/(Users|home)\/[^/]+/, '~')} ` : '的项目文件夹';
    }
    app.addEventListener('input', (e) => {
      if (e.target.matches?.('.bp-tree-search')) return filterTree(e.target.value);
      if (!e.target.matches?.('.bp-proj-filter')) return;
      const q = e.target.value.trim().toLowerCase();
      for (const row of app.querySelectorAll('.bp-projects > .list-row, .bp-homeview .bridge-threads > .bridge-thread')) {
        const name = (row.dataset.open || row.querySelector('.row-title, .t')?.textContent || '').toLowerCase();
        row.hidden = !!q && !name.includes(q);
      }
    });

    function filterTree(raw) {
      const q = raw.trim().toLowerCase(), tree = app.querySelector('.bp-tree');
      if (!tree) return;
      const more = tree.querySelector('.bp-tree-more');
      if (more) { if (q && !more.dataset.was) more.dataset.was = more.open ? '1' : '0'; more.open = q ? true : more.dataset.was === '1'; if (!q) delete more.dataset.was; }
      // a node shows when its name or one of its sessions' titles matches; its sessions show when the name matches
      // or they do. Only titles already listed are searched (closed nodes haven't fetched theirs).
      for (const node of tree.querySelectorAll('.bp-node')) {
        const nameHit = (node.querySelector('.n')?.textContent || '').toLowerCase().includes(q);
        let rowHit = false;
        for (const row of node.querySelectorAll('.bp-tree-thread, .bridge-thread-row')) {
          const t = (row.querySelector('.t') || row).textContent.toLowerCase().includes(q);
          row.hidden = !!q && !nameHit && !t;
          if (q && t) rowHit = true;
        }
        node.hidden = !!q && !nameHit && !rowHit;
        if (rowHit) node.classList.add('open');
      }
      for (const lab of tree.querySelectorAll('.bp-tree-label, .bp-tree-empty')) lab.hidden = !!q;
    }

    app.addEventListener('click', async (e) => {
      // the sidebar tree
      const node = e.target.closest('.bp-node[data-node]');
      if (node && e.target.closest('[data-toggle]')) {
        const key = node.dataset.node, open = !node.classList.contains('open');
        node.classList.toggle('open', open); e.target.closest('[data-toggle]').setAttribute('aria-expanded', String(open));
        open ? openNodes.add(key) : openNodes.delete(key); saveOpen();
        if (open) fillNode(node);
        return;
      }
      if (node && e.target.closest('[data-new]')) return goNode(node.dataset.node, null, true);
      const tt = e.target.closest('.bp-tree-thread[data-thread]');
      if (tt && node) return goNode(node.dataset.node, tt.dataset.thread);
      const bk = e.target.closest('.bp-backend [data-backend]');
      if (bk) return setBackend(bk.dataset.backend);
      if (e.target.closest('[data-home]')) { project = null; store.set('bridge_project', null); return transition(() => show(), 'back'); }
      // the project picker's own sidebar (the chat widget handles these itself)
      const act = e.target.closest('.bp-homeview [data-act]')?.dataset.act;
      if (act === 'side') {
        const root = app.firstElementChild;
        if (matchMedia('(max-width: 720px)').matches) root.classList.toggle('side-open');
        else { const pr = loadPrefs(); pr.sidebar = !pr.sidebar; savePrefs(pr); applyPrefs(root, pr); }
        return;
      }
      if (act === 'side-close') return app.firstElementChild.classList.remove('side-open');
      if (act === 'home-new') { app.firstElementChild.classList.remove('side-open'); return app.querySelector('#pj-url')?.focus(); }
      const del = e.target.closest('[data-del]');
      if (del) {
        const name = del.dataset.del;
        const typed = await confirm({ title: `删除项目「${name}」`, message: '无法恢复。目录里的文件和这个项目的对话都会删掉。', danger: true, confirmLabel: '删除项目',
          input: { label: `输入「${name}」确认`, placeholder: name, required: true, validate: (v) => v === name ? '' : '输入的名字不一致' } });
        if (typed === null) return;
        try { await api('DELETE', `/api/projects/${encodeURIComponent(name)}${bq()}`); } catch (err) { toast(err.message, true); }
        return showHome();
      }
      const open = e.target.closest('[data-open]');
      if (open) { project = open.dataset.open; store.set('bridge_project', project); return transition(() => show(), 'fwd'); }
    });
    app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches?.('[data-open]')) e.target.click(); });
    app.addEventListener('submit', async (e) => {
      const f = e.target.closest('[data-form]');
      if (!f) return;
      e.preventDefault();
      const body = f.dataset.form === 'clone' ? { clone_url: f.url.value.trim(), name: f.name.value.trim() } : { name: f.name.value.trim() };
      f.querySelector('button').disabled = true;
      try {
        const r = await api('POST', `/api/projects${bq()}`, body);
        openWhenReady = r.project.name;
        toast(f.dataset.form === 'clone' ? '开始克隆，完成后自动打开' : '正在创建…');
      } catch (err) { toast(err.message, true); f.querySelector('button').disabled = false; return; }
      showHome();
    });

    // the account at the sidebar's foot: avatar · name · one line of use, and a menu. Claude side: your share of the
    // 5 h / weekly windows, 账户与用量, 管理. DeepSeek side: only DeepSeek's own — its use and balance, its page.
    let acctMenus = [];
    async function renderAccount() {
      const boxes = app.querySelectorAll('.bp-acct');
      if (!boxes.length) return;
      let d;
      try { d = await api('GET', '/api/me'); } catch { return; }
      const u = d.user, us = d.usage, name = (d.sso && d.sso.portal_user) || u.display_name || u.username;
      const bk = backend && (d.backends || []).find(b => b.name === backend);
      let sub, full = false, items;
      if (bk && bk.local) {
        // a model on this machine: no money — its tokens and speed, and the machine's memory / loaded model
        const u3 = bk.usage, st = bk.stats || {}, lm = (st.loaded || [])[0];
        const gb = (b) => `${(b / 1073741824).toFixed(1)}G`;
        const tok = (p) => fmtTok(p.input_tokens + p.cache_read_tokens + p.output_tokens);
        const state = !bk.stats ? '未上报' : st.loaded == null ? '服务无响应' : lm ? `已加载 ${gb(lm.size)}` : '空闲';
        sub = `${bk.label} · 本地模型`;
        for (const card of app.querySelectorAll('.bp-svc-card')) {
          card.innerHTML = `<span class="top"><span class="lbl">${esc(bk.label)}</span><b class="${st.loaded == null && bk.stats ? 'low' : ''}">${esc(state)}</b></span>`
            + `<span class="spend"><span>24 小时 <b>${esc(tok(u3.day))}</b></span><span>7 天 <b>${esc(tok(u3.week))}</b></span>`
            + `<span>速度 <b>${u3.day.tok_s != null ? `${u3.day.tok_s} t/s` : u3.week.tok_s != null ? `${u3.week.tok_s} t/s` : '—'}</b></span></span>`
            + (bk.stats ? `<span class="spend"><span>内存余量 <b>${st.mem_free_pct ?? '—'}%</b></span><span>swap <b>${st.swap_used != null ? gb(st.swap_used) : '—'}</b></span></span>` : '');
          card.title = `${bk.label}：24 小时 ${u3.day.turns} 次、7 天 ${u3.week.turns} 次（tokens，不计费）`;
          card.setAttribute('aria-label', `${bk.label} 用量与本机状态`);
        }
        items = `<div class="bp-acct-menu-head">${esc(bk.label)} · 本地模型</div>`
          + `<a class="menu-item" href="/account?svc=${encodeURIComponent(bk.name)}">${iconSvg('settings')}${esc(bk.label)} 用量与本机状态</a>`;
      } else if (bk) {
        const bal = fmtBalance(bk.balance);
        sub = `${bk.label} · 按 API 价格计费`;
        const low = bk.balance?.is_available === false, u3 = bk.usage, cur = bk.currency;
        for (const card of app.querySelectorAll('.bp-svc-card')) {
          card.innerHTML = `<span class="top"><span class="lbl">${esc(bk.label)} 余额</span>`
            + `<b class="${low ? 'low' : ''}">${esc(bal || '—')}</b>${low ? '<span class="pill err">不足</span>' : ''}</span>`
            + `<span class="spend"><span>24 小时 <b>${esc(fmtMoney(u3.day.cost, cur))}</b></span><span>7 天 <b>${esc(fmtMoney(u3.week.cost, cur))}</b></span>`
            + `<span>30 天 <b>${esc(fmtMoney(u3.month.cost, cur))}</b></span></span>`;
          card.title = `${bk.label}：24 小时 ${u3.day.turns} 次、7 天 ${u3.week.turns} 次（按 API 价格估算）`;
        }
        items = `<div class="bp-acct-menu-head">${esc(bk.label)} · 按 API 价格计费</div>`
          + `<a class="menu-item" href="/account?svc=${encodeURIComponent(bk.name)}">${iconSvg('settings')}${esc(bk.label)} 用量与 API key</a>`;
      } else {
        const parts = [['five_hour', '5h'], ['seven_day', '周']]
          .filter(([k]) => us[k].used_pct != null)
          .map(([k, l]) => `${l} ${fmtPct(us[k].used_pct)}${us[k].limit_pct != null ? `/${fmtPct(us[k].limit_pct)}` : ''}`);
        full = !!us.blocked;
        sub = us.blocked ? '额度已用完' : (parts.join(' · ') || (u.role === 'admin' ? '管理员' : '账户设置'));
        items = `<a class="menu-item" href="/account">${iconSvg('user')}账户与用量</a>`
          + (u.role === 'admin' ? `<a class="menu-item" href="/admin">${iconSvg('users')}管理</a>` : '');
      }
      // portal SSO: sign-out lives in the corner account menu (it signs out of the portal)
      if (!d.sso) items += '<div class="menu-sep"></div><form method="post" action="/logout"><button type="submit" class="menu-item">' + iconSvg('log-out') + '退出登录</button></form>';
      for (const m of acctMenus) m.destroy();
      acctMenus = [];
      for (const box of boxes) {
        box.innerHTML = `<button type="button" class="bp-acct-btn" aria-haspopup="menu" aria-expanded="false" title="${esc(us.blocked && !bk ? us.blocked : '账户')}">`
          + `<span class="av" aria-hidden="true">${esc([...name][0] || '?').toUpperCase()}</span>`
          + `<span class="who"><span class="n">${esc(name)}</span><span class="u${full ? ' full' : ''}">${esc(sub)}</span></span>${iconSvg('chevrons-up-down')}</button>`
          + `<div class="menu up" role="menu" hidden>${items}</div>`;
        acctMenus.push(attachMenu(box.querySelector('.bp-acct-btn'), box.querySelector('.menu'), { align: 'start' }));
      }
    }
    // which backends this account may switch to (none for most accounts); a stale saved choice falls back to Claude
    try { backends = ((await api('GET', '/api/me')).backends || []).map(b => ({ name: b.name, label: b.label })); } catch {}
    if (backend && !backends.some(b => b.name === backend)) { backend = ''; store.set('bridge_backend', null); }
    show();
    setInterval(renderAccount, 120000);
    // A new release loads by itself (and after a long time away the page starts afresh) unless a draft is in the composer
    // or a dialog is open; a home-screen app gets its 刷新 button in the appearance panel (mountChrome).
    autoUpdate({
      current: document.documentElement.dataset.version,
      check: async () => (await (await fetch('/api/status', { cache: 'no-store' })).json())?.bridge?.version,
      isBusy: () => !!(widget?.input?.value || '').trim() || defaultIsBusy(),
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) renderAccount(); });
  </script>
</body>
</html>
