<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>claude-bridge</title>
  <link rel="stylesheet" href="/static/bridge/bridge-widget.css" />
  <link rel="stylesheet" href="/static/bridge/bridge-pages.css" />
  <style>
    body { margin: 0; }
    #app { height: 100vh; height: 100dvh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js" defer></script>
</head>
<body class="bridge-root">
  <div id="app"></div>
  <script type="module">
    import { BridgeClient } from '/static/bridge/bridge-client.js';
    import { mountBridgeWidget } from '/static/bridge/bridge-widget.js';
    import { api, esc, fmtPct, fmtSeen, toast } from '/static/bridge/bridge-pages.js';

    const client = new BridgeClient({ baseUrl: '/api', onAuthLost: () => { location.href = '/login'; } });
    const app = document.getElementById('app');
    const store = {
      get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
      set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
    };

    // Chat = scope ""; Code = scope "code:<project>", one directory per project in the user's own space
    let mode = store.get('bridge_mode', '') === 'code' ? 'code' : '';
    let project = store.get('bridge_project', '') || null;
    let widget = null, projects = [], agentOnline = true, poll = null, openWhenReady = null;

    const toggle = () => `<span class="bp-mode" role="tablist">${[['', 'Chat'], ['code', 'Code']].map(([k, l]) =>
      `<button type="button" role="tab" data-mode="${k}" aria-selected="${k === mode}">${l}</button>`).join('')}</span>`;

    function unmount() { widget?.destroy(); widget = null; clearTimeout(poll); poll = null; }

    function mountChat(scope, extra = '', proj = null) {
      unmount();
      // Code: the sidebar is this project's sessions, headed by the project itself
      const code = proj ? {
        sideHead: `<div class="bp-side-proj"><span class="ic">${FOLDER}</span><div class="who"><div class="n">${esc(proj.name)}</div>`
          + `<div class="d">${esc([proj.info?.branch, proj.source ? proj.source.replace(/^https?:\/\//, '').replace(/\.git$/, '') : '本地项目'].filter(Boolean).join(' · '))}</div></div>`
          + `<button type="button" class="bridge-btn bridge-btn-ghost bridge-tiny" data-home title="切换 / 新建项目">切换</button></div>`,
        strings: { newThread: '＋ 新会话', threadTitle: '新会话', del: '删除会话', delConfirm: '删除这个会话？记录会一起删除，项目里的文件不受影响。',
          empty: `在 ${proj.name} 里开始：描述你想让 Claude 做的事` },
      } : {};
      widget = mountBridgeWidget(app, client, {
        scope, title: 'claude-bridge', fill: true, topStart: toggle() + extra, sideFoot: '<div class="bp-me"></div>',
        placeholder: scope ? '让 Claude 读代码、改文件、跑命令' : '输入消息', ...code,
      });
      renderMe();
    }

    async function show() {
      if (mode === '') { document.title = 'claude-bridge · Chat'; return mountChat(''); }
      if (project) {
        await loadProjects();
        const p = projects.find(x => x.name === project && x.status === 'ready');
        if (p) {
          document.title = `claude-bridge · ${p.name}`;
          return mountChat(`code:${p.name}`, `<button type="button" class="bp-proj" data-home title="切换 / 新建项目">${FOLDER}<span>${esc(p.name)}</span><i>▾</i></button>`, p);
        }
        project = null; store.set('bridge_project', null);
      }
      return showHome();
    }

    const FOLDER = '<svg viewBox="0 0 16 16" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 4.2c0-.6.5-1.1 1.1-1.1h3.2l1.4 1.5h5.6c.6 0 1.1.5 1.1 1.1v6.2c0 .6-.5 1.1-1.1 1.1H2.9c-.6 0-1.1-.5-1.1-1.1z"/></svg>';
    const STATUS = { creating: ['准备中…', ''], deleting: ['删除中…', 'off'], failed: ['失败', 'off'] };

    async function loadProjects() {
      try { const d = await api('GET', '/api/projects'); projects = d.items; agentOnline = !!d.agent?.online; } catch (e) { toast(e.message, true); }
    }

    // ---------- the project picker (Code mode without an open project) ----------
    async function showHome() {
      unmount();
      document.title = 'claude-bridge · Code';
      await loadProjects();
      if (openWhenReady && projects.some(p => p.name === openWhenReady && p.status === 'ready')) {
        project = openWhenReady; openWhenReady = null; store.set('bridge_project', project); return show();
      }
      const busy = projects.some(p => p.status === 'creating' || p.status === 'deleting');
      const rows = projects.map(p => {
        const [st, cls] = STATUS[p.status] || ['', ''];
        const src = p.source ? esc(p.source.replace(/^https?:\/\//, '')) : '空项目';
        const meta = [p.info?.branch ? `分支 ${esc(p.info.branch)}` : '', p.threads ? `${p.threads} 段对话` : '', p.last_used ? esc(fmtSeen(p.last_used)) : ''].filter(Boolean).join(' · ');
        return `<div class="bp-project${p.status === 'ready' ? ' ready' : ''}" ${p.status === 'ready' ? `data-open="${esc(p.name)}" tabindex="0" role="button"` : ''}>
          <span class="ic">${FOLDER}</span>
          <div class="who"><div class="n">${esc(p.name)} ${st ? `<span class="bp-tag ${cls}">${st}</span>` : ''}</div>
            <div class="d">${src}${meta ? ` · ${meta}` : ''}</div>
            ${p.status === 'failed' && p.error ? `<div class="d err">${esc(p.error)}</div>` : ''}</div>
          ${p.status === 'deleting' ? '' : `<button type="button" class="bridge-btn bridge-btn-ghost bridge-tiny" data-del="${esc(p.name)}" title="删除项目">删除</button>`}
        </div>`;
      }).join('');
      app.innerHTML = `<div class="bp-home bridge-root">
        <header class="bp-home-top">${toggle()}<span class="grow"></span><span class="bp-me"></span></header>
        <main class="bp-wrap narrow">
          <h1>选择项目</h1>
          <p class="bp-help">每个项目是你专属空间里的一个目录（通常是 git 仓库）。Claude 在项目里读写文件、跑命令，每个项目有自己的对话记录。</p>
          ${agentOnline ? '' : '<div class="bp-blocked">helper 现在离线：新建 / 克隆会排队，等它上线后执行。</div>'}
          <div class="bp-projects">${rows || '<p class="bp-help" style="margin:0">还没有项目，先克隆一个仓库或新建一个空项目。</p>'}</div>
          <div class="bp-grid" style="margin-top:16px">
            <form class="bp-card" data-form="clone">
              <h2>克隆 Git 仓库</h2>
              <label class="bp-field"><span>仓库地址（https:// 或 git@）</span><input class="bp-input" name="url" required placeholder="https://github.com/用户/仓库.git" autocapitalize="none" spellcheck="false" /></label>
              <label class="bp-field"><span>项目名（可留空，默认用仓库名）</span><input class="bp-input" name="name" maxlength="64" autocapitalize="none" spellcheck="false" /></label>
              <div class="bp-actions"><button class="bridge-btn bridge-btn-primary">克隆</button></div>
            </form>
            <form class="bp-card" data-form="new">
              <h2>新建空项目</h2>
              <label class="bp-field"><span>项目名（字母、数字、. _ -）</span><input class="bp-input" name="name" required maxlength="64" placeholder="my-app" autocapitalize="none" spellcheck="false" /></label>
              <p class="bp-help" style="margin:0 0 12px">会建一个带 git 的空目录，之后让 Claude 从零开始写。</p>
              <div class="bp-actions"><button class="bridge-btn bridge-btn-primary">创建</button></div>
            </form>
          </div>
        </main></div>`;
      renderMe();
      if (busy || openWhenReady) poll = setTimeout(showHomeIfStill, 2000);
    }
    const showHomeIfStill = () => { if (mode === 'code' && !project) showHome(); };

    app.addEventListener('click', async (e) => {
      const m = e.target.closest('[data-mode]');
      if (m && m.dataset.mode !== mode) { mode = m.dataset.mode; store.set('bridge_mode', mode); return show(); }
      if (e.target.closest('[data-home]')) { project = null; store.set('bridge_project', null); return show(); }
      const del = e.target.closest('[data-del]');
      if (del) {
        const name = del.dataset.del;
        if (prompt(`删除项目「${name}」：目录里的文件和这个项目的对话都会删掉，无法恢复。\n输入项目名确认：`) !== name) return;
        try { await api('DELETE', `/api/projects/${encodeURIComponent(name)}`); } catch (err) { toast(err.message, true); }
        return showHome();
      }
      const open = e.target.closest('[data-open]');
      if (open) { project = open.dataset.open; store.set('bridge_project', project); return show(); }
    });
    app.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches?.('[data-open]')) e.target.click(); });
    app.addEventListener('submit', async (e) => {
      const f = e.target.closest('[data-form]');
      if (!f) return;
      e.preventDefault();
      const body = f.dataset.form === 'clone' ? { clone_url: f.url.value.trim(), name: f.name.value.trim() } : { name: f.name.value.trim() };
      f.querySelector('button').disabled = true;
      try {
        const r = await api('POST', '/api/projects', body);
        openWhenReady = r.project.name;
        toast(f.dataset.form === 'clone' ? '开始克隆，完成后自动打开' : '正在创建…');
      } catch (err) { toast(err.message, true); f.querySelector('button').disabled = false; return; }
      showHome();
    });

    // who is signed in + how much of their share is left
    async function renderMe() {
      const box = document.querySelector('.bp-me');
      if (!box) return;
      let d;
      try { d = await api('GET', '/api/me'); } catch { return; }
      const u = d.user, us = d.usage;
      const parts = [['five_hour', '5h'], ['seven_day', '周']]
        .filter(([k]) => us[k].limit_pct != null && us[k].used_pct != null)
        .map(([k, l]) => `${l} ${fmtPct(us[k].used_pct)}/${fmtPct(us[k].limit_pct)}`);
      const sub = us.blocked ? '额度已用完' : u.role === 'admin' ? '管理员' : (parts.join(' · ') || '账户设置');
      box.innerHTML = `<a class="me" href="/account" title="账户设置与用量${us.blocked ? `\n${esc(us.blocked)}` : ''}">`
        + `<span class="n">${esc(u.display_name || u.username)}</span><span class="u${us.blocked ? ' full' : ''}">${esc(sub)}</span></a>`
        + (u.role === 'admin' ? '<a class="bridge-btn bridge-btn-ghost bridge-tiny" href="/admin" style="text-decoration:none">管理</a>' : '')
        + '<form method="post" action="/logout"><button type="submit" class="bridge-btn bridge-btn-ghost bridge-tiny" title="退出登录">退出</button></form>';
    }
    show();
    setInterval(renderMe, 120000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) renderMe(); });
  </script>
</body>
</html>
