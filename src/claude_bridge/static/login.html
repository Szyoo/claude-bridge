<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claude-bridge · 登录</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="{{design_origin}}" crossorigin />
  <link rel="stylesheet" href="{{design_base}}/tokens.css" />
  <link rel="stylesheet" href="{{design_base}}/components.css" />
  <script type="importmap">{"imports": {"@szyyw/design/": "{{design_base}}/"}}</script>
  <link rel="stylesheet" href="/static/bridge/bridge-pages.css" />
  <script type="module" src="/static/bridge/corner-boot.js"></script>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="app-frame">
    <main class="app-main auth-shell">
      <div class="glass auth-card rise">
        <h1 class="app-title">claude-bridge</h1>
        <form class="stack" method="post" action="/login">
          <div class="form-row"><label for="l-pass">口令</label>
            <input id="l-pass" class="field" type="password" name="password" autofocus autocomplete="current-password" required /></div>
          <div class="err-text bp-err" role="alert">{{error}}</div>
          <button type="submit" class="btn">登录</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
