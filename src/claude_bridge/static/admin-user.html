<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claude-bridge · 用户</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="{{design_origin}}" crossorigin />
  <link rel="stylesheet" href="{{design_base}}/tokens.css" />
  <link rel="stylesheet" href="{{design_base}}/components.css" />
  <script type="importmap">{"imports": {"@szyyw/design/": "{{design_base}}/"}}</script>
  <link rel="stylesheet" href="/static/bridge/bridge-widget.css" />
  <link rel="stylesheet" href="/static/bridge/bridge-pages.css" />
  <script type="module" src="/static/bridge/corner-boot.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js" defer></script>
  <style>
    .au-tabs { margin-bottom: var(--sp-3); }
    .au-chat { display: grid; grid-template-columns: minmax(200px, 280px) minmax(0, 1fr); gap: 12px; align-items: start; }
    .au-threads { max-height: calc(100vh - 250px); overflow: auto; padding: var(--sp-2); }
    .au-group { font-size: var(--fs-sm); font-weight: 600; color: var(--text-dim); padding: var(--sp-3) var(--sp-2) var(--sp-1); }
    .au-group:first-child { padding-top: 2px; }
    .au-threads .list-row { width: 100%; text-align: left; }
    .au-view { min-width: 0; overflow: hidden; }
    .au-view-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line-soft); }
    .au-view-head .t { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .au-msgs { max-height: calc(100vh - 290px); overflow: auto; padding: var(--sp-4); }
    .au-back { display: none; }
    .au-access td.ua { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
    .au-access td { vertical-align: top; }
    .au-access tr.empty-row td { vertical-align: middle; }
    @media (max-width: 720px) {
      .au-chat { grid-template-columns: minmax(0, 1fr); }
      .au-chat.reading .au-list { display: none; }
      .au-chat:not(.reading) .au-view { display: none; }
      .au-threads, .au-msgs { max-height: none; }
      .au-back { display: inline-block; }
      .au-msgs { padding: var(--sp-3); }
      .au-access td.ua, .au-access th.ua { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="app-frame">
    <header class="app-header">
      <div class="app-brand"><h1 class="app-title" id="who">用户</h1><p class="app-sub">claude-bridge · 只读查看</p></div>
      <nav class="app-actions"><a class="btn-ghost btn-small" href="/admin"><i data-icon="arrow-left"></i>管理</a></nav>
    </header>

    <main class="app-main bp-wrap">
      <p class="muted small bp-lead">只读查看：这里的操作不会改动对方的任何数据，对方页面上也看不到。</p>
      <div class="tabs compact au-tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-tab="chat" aria-selected="true">对话</button>
        <button type="button" class="tab" role="tab" data-tab="access" aria-selected="false">访问记录</button>
        <button type="button" class="tab" role="tab" data-tab="keys" aria-selected="false" id="tab-keys-btn" hidden>API 密钥</button>
      </div>

      <section id="tab-chat" class="au-chat">
        <div class="glass au-list"><div class="list compact au-threads" id="threads"></div></div>
        <div class="glass au-view">
          <div class="au-view-head"><button type="button" class="btn-ghost btn-small au-back" id="back"><i data-icon="arrow-left"></i>列表</button><span class="t" id="title">选一段对话</span><span class="muted small" id="meta"></span></div>
          <div class="au-msgs bridge-root" id="msgs"><p class="muted small">左边选一段对话查看内容。</p></div>
        </div>
      </section>

      <section id="tab-access" class="glass panel" hidden>
        <p class="muted small bp-lead">同一 IP、同一设备连续访问合并为一行（30 分钟内没有请求才算新的一次）；保留 180 天。门户登录模式下登录发生在门户，这里记的是访问。</p>
        <div class="table-wrap"><table class="tbl reflow au-access"><thead><tr><th aria-sort="descending"><button type="button" class="th-sort">时间</button></th><th aria-sort="none"><button type="button" class="th-sort">IP</button></th><th aria-sort="none"><button type="button" class="th-sort">设备</button></th><th class="col-num" aria-sort="none"><button type="button" class="th-sort">请求数</button></th><th class="ua">User-Agent</th></tr></thead><tbody id="access"></tbody></table></div>
      </section>

      <section id="tab-keys" class="glass panel" hidden>
        <p class="muted small bp-lead">这个用户自助创建的 API 密钥；可以代为吊销，吊销后立刻失效。</p>
        <div id="keys"></div>
        <div class="callout warn bp-gap" id="keys-warn" hidden></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { renderTurn, enhanceTurnImages } from '/static/bridge/bridge-widget.js';
    import { api, esc, toast, fmtSeen, fmtDevice, fmtGeo, armWithWarning } from '/static/bridge/bridge-pages.js';
    import { enhanceIcons } from '@szyyw/design/icons.js';
    import { enhanceSortTable } from '@szyyw/design/table.js';
    import { openLightbox } from '@szyyw/design/lightbox.js';
    enhanceIcons();
    enhanceSortTable(document.querySelector('.au-access'));
    const $ = (s) => document.querySelector(s);
    const uid = Number(location.pathname.split('/').pop());
    const KIND = { visit: '访问', login: '登录', login_failed: '登录失败' };
    let current = null;

    const local = (t) => t ? new Date(t.replace(' ', 'T') + 'Z').toLocaleString('zh-CN', { hour12: false }) : '';

    for (const b of document.querySelectorAll('[data-tab]')) b.addEventListener('click', () => {
      for (const x of document.querySelectorAll('[data-tab]')) x.setAttribute('aria-selected', String(x === b));
      $('#tab-chat').hidden = b.dataset.tab !== 'chat';
      $('#tab-access').hidden = b.dataset.tab !== 'access';
      $('#tab-keys').hidden = b.dataset.tab !== 'keys';
      if (b.dataset.tab === 'access') loadAccess();
      if (b.dataset.tab === 'keys') loadKeys();
    });

    async function loadThreads() {
      const d = await api('GET', `/api/admin/users/${uid}/threads`);
      const u = d.user;
      $('#who').textContent = `${u.display_name || u.username}（${u.username}）`;
      document.title = `claude-bridge · ${u.username}`;
      const groups = new Map([['', []]]);
      for (const t of d.items) {
        const key = t.scope || '';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(t);
      }
      const label = (k) => k === '' ? 'Chat' : k.startsWith('code:') ? `Code · ${k.slice(5)}` : k;
      const html = [...groups].filter(([, ts]) => ts.length).map(([k, ts]) =>
        `<div class="au-group">${esc(label(k))}</div>` + ts.map(t =>
          `<button type="button" class="list-row" data-id="${esc(t.id)}"><span class="row-main"><span class="row-title">${esc(t.title || '新对话')}</span>`
          + `<span class="row-sub">${t.n} 条 · ${esc(fmtSeen(t.updated_at))}</span></span></button>`).join('')).join('');
      $('#threads').innerHTML = html || '<p class="muted small">还没有对话。</p>';
    }

    async function openThread(id) {
      current = id;
      for (const b of document.querySelectorAll('#threads [data-id]')) b.classList.toggle('selected', b.dataset.id === id);
      $('#tab-chat').classList.add('reading');
      $('#msgs').innerHTML = '<p class="muted small"><span class="spinner"></span> 加载中…</p>';
      let d;
      try { d = await api('GET', `/api/admin/users/${uid}/threads/${encodeURIComponent(id)}/messages`); } catch (e) { toast(e.message, true); return; }
      if (current !== id) return;
      const th = d.thread;
      $('#title').textContent = th.title || '新对话';
      $('#meta').textContent = `${th.scope ? (th.scope.startsWith('code:') ? `Code · ${th.scope.slice(5)}` : th.scope) : 'Chat'} · ${d.items.length} 条`;
      const box = $('#msgs');
      box.innerHTML = '';
      for (const m of d.items) {
        const el = document.createElement('div');
        renderTurn(el, m, { strings: { me: '对方' }, fileUrl: (fid) => `/api/admin/files/${encodeURIComponent(fid)}` });
        box.appendChild(el);
      }
      if (!d.items.length) box.innerHTML = '<p class="muted small">这段对话还没有消息。</p>';
      box.scrollTop = box.scrollHeight;
    }

    enhanceTurnImages($('#msgs'), (items, start, link) => openLightbox({ items, start, returnFocus: link }));

    async function loadAccess() {
      try {
        const d = await api('GET', `/api/admin/users/${uid}/access`);
        $('#access').innerHTML = d.items.map(a => {
          const span = a.first_at === a.last_at ? local(a.last_at) : `${local(a.first_at)} – ${local(a.last_at).split(' ').pop()}`;
          const kind = a.kind === 'visit' ? '' : `<span class="${a.kind === 'login_failed' ? 'err-text' : ''}">${KIND[a.kind]}</span>`;
          return `<tr${a.kind === 'login_failed' ? ' class="err"' : ''}><td data-sort="${esc(a.last_at)}">${esc(span)}${kind ? `<div class="tiny muted">${kind}</div>` : ''}</td>`
            + `<td data-label="IP">${esc(a.ip || '—')}${a.geo ? `<div class="tiny muted">${esc(fmtGeo(a.geo))}</div>` : ''}</td>`
            + `<td data-label="设备">${esc(fmtDevice(a.user_agent))}</td><td class="col-num" data-label="请求数">${a.hits ?? 1}</td>`
            + `<td class="ua" title="${esc(a.user_agent)}">${esc(a.user_agent)}</td></tr>`;
        }).join('') || '<tr class="empty-row"><td colspan="5">还没有记录。</td></tr>';
      } catch (e) { toast(e.message, true); }
    }

    // API keys: the tab only shows when the server exposes them (404 otherwise)
    async function loadKeys() {
      let d;
      try { d = await api('GET', `/api/admin/users/${uid}/api-keys`); } catch { return; }
      $('#keys').innerHTML = d.items.length ? '<div class="list divided">' + d.items.map(k => `<div class="list-row" data-name="${esc(k.name)}">`
        + `<span class="row-main"><span class="row-title">${esc(k.note || '（无备注）')}</span><span class="row-sub mono">${esc(k.name)}</span>`
        + `<span class="row-sub">创建：${esc(local(k.created_at) || '—')} · 最近使用：${k.last_used_at ? esc(fmtSeen(k.last_used_at)) : '从未使用'} · ${k.disabled ? '已吊销' : '有效'}</span></span>`
        + (k.disabled ? '' : '<span class="row-end"><button type="button" class="btn-ghost btn-small" data-revoke>吊销</button></span>') + '</div>').join('') + '</div>'
        : '<p class="muted small">还没有密钥。</p>';
      for (const b of $('#keys').querySelectorAll('[data-revoke]')) armWithWarning(b, $('#keys-warn'), '吊销后这个密钥立刻失效，无法恢复。');
    }
    $('#keys').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-revoke]');
      if (!btn) return;
      try {
        await api('DELETE', `/api/admin/users/${uid}/api-keys/${encodeURIComponent(btn.closest('[data-name]').dataset.name)}`);
        toast('已吊销'); loadKeys();
      } catch (err) { toast(err.message, true); }
    });
    api('GET', `/api/admin/users/${uid}/api-keys`).then(() => { $('#tab-keys-btn').hidden = false; }, () => {});

    $('#threads').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) openThread(b.dataset.id); });
    $('#back').addEventListener('click', () => $('#tab-chat').classList.remove('reading'));
    loadThreads().catch(e => toast(e.message, true));
  </script>
</body>
</html>
