<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claude-bridge · 账户</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/bridge/vendor/szyyw-design/tokens.css" />
  <link rel="stylesheet" href="/static/bridge/vendor/szyyw-design/components.css" />
  <link rel="stylesheet" href="/static/bridge/bridge-pages.css" />
  <script type="module" src="/static/bridge/corner-boot.js"></script>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="app-frame">
    <header class="app-header">
      <div class="app-brand"><h1 class="app-title">我的账户</h1><p class="app-sub">claude-bridge</p></div>
      <nav class="app-actions">
        <a class="btn-ghost btn-small" href="/admin" data-admin hidden>管理</a>
        <a class="btn-ghost btn-small" href="/">← 回到聊天</a>
      </nav>
    </header>

    <main class="bp-wrap narrow">
      <section class="glass panel">
        <h2 class="panel-title">用量</h2>
        <p class="muted small bp-lead">按你在这个订阅里的份额计算，窗口与 Claude 账户的 5 小时 / 每周额度同步重置。</p>
        <div class="bp-grid" id="usage"></div>
        <div id="blocked"></div>
      </section>

      <form class="glass panel" id="profile">
        <h2 class="panel-title">资料</h2>
        <p class="muted small bp-lead">用户名用来登录；显示名只出现在界面上。</p>
        <div class="form-row"><label for="f-username">用户名</label><input id="f-username" class="field" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32" /></div>
        <div class="form-row"><label for="f-display">显示名</label><input id="f-display" class="field" name="display_name" maxlength="40" placeholder="可留空" /></div>
        <div class="actions"><button type="submit" class="btn">保存</button></div>
      </form>

      <form class="glass panel" id="password">
        <h2 class="panel-title">修改密码</h2>
        <p class="muted small bp-lead">改完后其它设备需要重新登录，这台设备保持登录。</p>
        <div class="form-row"><label for="f-current">当前密码</label><input id="f-current" class="field" type="password" name="current" autocomplete="current-password" required /></div>
        <div class="form-row"><label for="f-new">新密码（至少 8 位）</label><input id="f-new" class="field" type="password" name="new" autocomplete="new-password" minlength="8" required /></div>
        <div class="form-row"><label for="f-again">再输一次</label><input id="f-again" class="field" type="password" name="again" autocomplete="new-password" minlength="8" required /></div>
        <div class="actions"><button type="submit" class="btn">修改密码</button></div>
      </form>

      <form method="post" action="/logout" class="actions" id="logout"><button type="submit" class="btn-ghost">退出登录</button></form>
    </main>
  </div>

  <script type="module">
    import { api, esc, toast, fmtWhen, userMeter, WINDOWS } from '/static/bridge/bridge-pages.js';
    const $ = (s) => document.querySelector(s);
    const profile = $('#profile'), pw = $('#password');

    async function load() {
      const d = await api('GET', '/api/me');
      const u = d.user, us = d.usage;
      profile.username.value = u.username;
      profile.display_name.value = u.display_name || '';
      $('[data-admin]').hidden = u.role !== 'admin';
      if (d.sso) {  // portal SSO: the password lives in the portal; this site's own one is unused
        pw.hidden = true;
        $('#logout').hidden = true;  // sign-out is the corner account menu's (portal) 登出
        $('#profile .bp-lead').textContent = `通过门户登录（${d.sso.portal_user || ''}）；用户名与显示名只出现在这里的界面上。`;
      }
      $('#usage').innerHTML = u.role === 'admin'
        ? '<p class="muted small">管理员不受额度限制。整个订阅的用量在「管理」页。</p>'
        : WINDOWS.map(([k, label]) => {
          const w = us[k], reset = fmtWhen(w.resets_at);
          return `<div>${userMeter(w, label)}${reset ? `<div class="tiny muted">重置：${esc(reset)}</div>` : ''}</div>`;
        }).join('');
      $('#blocked').innerHTML = us.blocked ? `<div class="callout err bp-gap">${esc(us.blocked)}</div>` : '';
    }

    profile.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('PATCH', '/api/me', { username: profile.username.value.trim(), display_name: profile.display_name.value.trim() });
        toast('已保存'); load();
      } catch (err) { toast(err.message, true); }
    });

    pw.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (pw.new.value !== pw.again.value) { toast('两次输入的新密码不一致', true); return; }
      try {
        await api('POST', '/api/me/password', { current: pw.current.value, new: pw.new.value });
        pw.reset(); toast('密码已修改');
      } catch (err) { toast(err.message, true); }
    });

    load().catch(e => toast(e.message, true));
  </script>
</body>
</html>
