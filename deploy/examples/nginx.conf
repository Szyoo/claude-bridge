# nginx alternative (certificate via certbot). The server already sends X-Accel-Buffering: no for SSE.
server {
    listen 443 ssl http2;
    server_name bridge.example.com;
    ssl_certificate     /etc/letsencrypt/live/bridge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.example.com/privkey.pem;

    client_max_body_size 10m;          # image uploads are ≤ 7 MB

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # login rate limit is per client IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;         # SSE streams and the worker's long poll stay open
        proxy_buffering off;
    }
}
server {
    listen 80;
    server_name bridge.example.com;
    return 301 https://$host$request_uri;
}
