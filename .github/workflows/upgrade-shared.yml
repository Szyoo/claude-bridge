# 共享包（szyyw-auth、@szyyw/design）有新正式 tag → 升级 → 测试通过就直接推到 main → VPS 的 szyyw-autodeploy
# 在 2 分钟内上线（测试失败就不推；上线后健康检查失败由 deploy-app.sh 自动回滚）。
# 注意：bot 用 GITHUB_TOKEN 推送不会再触发 test.yml，所以这里自己跑一遍完整测试。
name: upgrade-shared
on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upgrade-shared
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 检查并升级
        id: up
        run: |
          summary=$(scripts/upgrade-shared.sh)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "${summary:-已是最新}"
      - uses: actions/setup-python@v5
        if: steps.up.outputs.summary != ''
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.up.outputs.summary != ''
        with:
          node-version: "22"
      - name: 装依赖并测试
        if: steps.up.outputs.summary != ''
        run: |
          pip install -e ".[dev,serve]"
          ruff check src tests
          pytest
      - name: 提交并推送
        if: steps.up.outputs.summary != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/claude_bridge/static/vendor/szyyw-design
          git commit -m "chore(deps): ${{ steps.up.outputs.summary }}（自动升级，测试通过）"
          git push origin HEAD:main
